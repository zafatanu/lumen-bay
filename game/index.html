<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2a1b33">
<title>LUMEN BAY</title>
<noscript><p style="padding:2em;font-family:sans-serif">Lumen Bay needs JavaScript to run.</p></noscript>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #2a1b33; }
  body { font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; }
  #world3d { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* HUD lives in the DOM, layered above the WebGL canvas so it stays crisp. */
  #hud {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    font-weight: 700; letter-spacing: 0.02em; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  /* The status line is read aloud by screen readers, never shown on screen. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud > .fullscreen { position: absolute; inset: 0; }
  .title-box {
    position: absolute; inset: 0; display: grid; place-content: center;
    text-align: center; gap: 0.5em; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(42,27,85,0.45), rgba(42,27,85,0.85));
  }
  .title-box h1 { margin: 0; font-size: 4em; letter-spacing: 0.18em; color: #ffd9a0;
    text-shadow: 0 4px 14px rgba(255,122,106,0.6); }
  .title-box p { margin: 0; font-size: 1.1em; opacity: 0.95; }
  /* Crosshair: a small cross that follows the mouse while a gun is drawn. */
  #crosshair {
    position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px;
    pointer-events: none; display: none; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: currentColor; border-radius: 2px;
  }
  #crosshair::before { left: 11px; top: 0; width: 2px; height: 24px; }
  #crosshair::after { top: 11px; left: 0; height: 2px; width: 24px; }
  /* Wasted screen: full overlay like the pause screen, on player death. */
  #wasted-screen {
    position: absolute; inset: 0; place-content: center;
    text-align: center; gap: 0.5em; pointer-events: none; display: none;
    background: radial-gradient(ellipse at center, rgba(120,10,10,0.35), rgba(40,0,0,0.8));
  }
  #wasted-screen h2 { margin: 0; font-size: 3.5em; letter-spacing: 0.15em; color: #ff5a5a;
    text-shadow: 0 3px 10px rgba(0,0,0,0.8); }
  #wasted-screen p { margin: 0; font-size: 1.05em; opacity: 0.95; }
  /* Busted screen: a cop grabs Rook while wanted; a heavier fine applies. */
  #busted-screen {
    position: absolute; inset: 0; place-content: center;
    text-align: center; gap: 0.5em; pointer-events: none; display: none;
    background: radial-gradient(ellipse at center, rgba(20,30,120,0.4), rgba(0,5,40,0.85));
  }
  #busted-screen h2 { margin: 0; font-size: 3.5em; letter-spacing: 0.15em; color: #5a9aff;
    text-shadow: 0 3px 10px rgba(0,0,0,0.8); }
  #busted-screen p { margin: 0; font-size: 1.05em; opacity: 0.95; }
</style>
</head>
<body>
<canvas id="world3d" width="1280" height="720" aria-label="Lumen Bay: drive a stolen car across a sunlit open-world island city"></canvas>
<div id="hud">
  <div id="mission-panel" class="fullscreen"></div>
  <div id="police-list" class="fullscreen"></div>
  <canvas id="minimap" class="fullscreen" width="192" height="192"></canvas>
  <div id="wanted" class="fullscreen"></div>
  <div id="money" class="fullscreen"></div>
  <div id="clock" class="fullscreen"></div>
  <div id="speedo" class="fullscreen"></div>
  <div id="radio" class="fullscreen"></div>
  <div id="dialogue" class="fullscreen"></div>
  <div id="weapons" class="fullscreen"></div>
  <div id="crosshair" class="fullscreen"></div>
  <div id="wasted-screen" class="fullscreen">
    <h2>WASTED</h2>
    <p>Rook is down. Respawned at the hospital for $500, wanted cleared.</p>
  </div>
  <div id="busted-screen" class="fullscreen">
    <h2>BUSTED</h2>
    <p>Captain Solano has you. Pay the fine and wanted cleared.</p>
  </div>
  <div id="controls-footer" class="fullscreen"></div>
  <div id="popups" class="fullscreen"></div>
  <div id="menu" class="fullscreen"></div>
  <div id="map-screen" class="fullscreen"></div>
  <div id="pause-screen" class="fullscreen"></div>
  <div id="title-screen" class="fullscreen">
    <div class="title-box">
      <h1>LUMEN BAY</h1>
      <p>Press <b>Enter</b> to start. <b>M</b> map · <b>Esc</b> pause.</p>
    </div>
  </div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
